# Void Sunset — Hyprland borders (pre-4.0 Omarchy / plain Hyprland). Generated; do not edit by hand.
$activeBorderColor = rgba(ff8a3dee) rgba(ff3f8eee) 90deg
$inactiveBorderColor = rgba(a98aa655)

general {
    col.active_border = $activeBorderColor
    col.inactive_border = $inactiveBorderColor
}

group {
    col.border_active = $activeBorderColor
    col.border_inactive = $inactiveBorderColor
}
