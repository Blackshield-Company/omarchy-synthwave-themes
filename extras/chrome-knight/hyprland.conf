# Chrome Knight — Hyprland borders (pre-4.0 Omarchy / plain Hyprland). Generated; do not edit by hand.
$activeBorderColor = rgba(22e3ffee) rgba(b48cffee) 45deg
$inactiveBorderColor = rgba(8b9bb855)

general {
    col.active_border = $activeBorderColor
    col.inactive_border = $inactiveBorderColor
}

group {
    col.border_active = $activeBorderColor
    col.border_inactive = $inactiveBorderColor
}
