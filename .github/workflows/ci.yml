name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq lua5.4 shellcheck && sudo ln -sf "$(command -v luac5.4)" /usr/local/bin/luac
      - run: ./validate.sh
      - run: python -m unittest discover -s tests -v
